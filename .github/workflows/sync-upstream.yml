name: Auto Sync Upstream

on:
  schedule:
    # Runs weekly on Fridays at 2:00 PM UTC
    - cron: "0 14 * * 5"
  workflow_dispatch: 

jobs:
  sync:
    name: Sync with Main Repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork Target Branch
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.SYNC_PAT }}
          fetch-depth: 0

      - name: Fetch and Sync from Upstream
        run: |
          # 1. Identify yourself to Git so it can merge files
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 2. Add the original developer's repository as a source link
          git remote add upstream https://github.com/JuliusBairaktaris/Qualcommax_NSS_Builder.git
          
          # 3. Pull down the newest upstream updates
          git fetch upstream main
          
          # 4. Merge changes cleanly. 
          # This pulls down upstream workflow files successfully using your advanced SYNC_PAT rights.
          git merge upstream/main --allow-unrelated-histories -m "Automated upstream sync"
          
          # 5. Push the updated files back to your personal main branch
          git push origin main
