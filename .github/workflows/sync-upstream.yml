name: Auto Sync Upstream (Simple Method)

on:
  schedule:
    - cron: "0 14 * * 5"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync upstream changes
        # This logs into GitHub using the default, built-in action token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo sync ${{ github.repository }} --branch main
